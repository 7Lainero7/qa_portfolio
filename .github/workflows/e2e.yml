name: E2E CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - "e2e/**"
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "e2e/**"
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qa_portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Поднимаем Backend (он нужен фронтенду для API)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Start Backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: qa_portfolio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          API_KEY: test-key
        run: |
          cd backend
          # Запускаем в фоне, чтобы шаг не блокировался
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          sleep 3 # Даём время на инициализацию БД и старт сервера

      # 2. Поднимаем Frontend и Playwright
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e/package.json

      - name: Install E2E dependencies
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          CI: true
        run: |
          cd e2e
          npx playwright test

      # 3. Сохраняем артефакты при падении (опционально, но полезно)
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7