[pytest]
pythonpath = .
testpaths = tests
addopts = 
    -v 
    --strict-markers 
    --cov=app 
    --cov-report=term-missing 
    --cov-report=html
    --cov-fail-under=90

filterwarnings =
    ignore::DeprecationWarning:starlette.testclient
    ignore::DeprecationWarning:httpx
    
markers = 
    smoke: critical path checks
    negative: negative scenarios
    boundary: boundary value checks
    api: API tests
